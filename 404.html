<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Arpi</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .nf { width: min(560px, 100%); text-align: center; }
  .nf .code { font-family: var(--serif); font-style: italic; font-size: clamp(110px, 28vw, 220px); line-height: .8; letter-spacing: -.05em;
    background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .nf h1 { margin: 22px 0 10px; font-weight: 600; font-size: clamp(30px, 6vw, 44px); letter-spacing: -.04em; line-height: 1.05; }
  .nf p { margin: 0 0 28px; color: var(--muted); }
</style>
</head>
<body>
  <main class="nf">
    <div class="code" aria-hidden="true">404</div>
    <h1>Hmm, nothing here</h1>
    <p>That page doesn't exist, but the rest of the site does.</p>
    <a class="btn primary" href="/">Back to the front page</a>
  </main>
</body>
</html>
