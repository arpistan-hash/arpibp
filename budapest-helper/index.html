<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budapest Helper</title>
<meta name="description" content="Spoken, up-to-date answers for visiting Budapest, with questions answered by the owner or the community.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Budapest Helper</h1>
  <label class="lang">Voice
    <select id="lang"><option value="en-GB">English</option><option value="hu-HU">Magyar</option></select>
  </label>
</header>

<main>
  <input id="search" type="search" placeholder="Search topics…" aria-label="Search topics">
  <p id="prompt" class="prompt"></p>
  <div id="topics" class="topics"></div>

  <section id="ask" class="ask">
    <h2>Ask a question</h2>
    <p class="hint">Arpi or the community answers. Answered questions appear below.</p>
    <form id="askForm">
      <select name="topic" id="askTopic" aria-label="Topic"></select>
      <textarea name="q" rows="3" required maxlength="500" placeholder="Type or dictate your question"></textarea>
      <input name="name" placeholder="Your name (optional)" maxlength="60">
      <input type="text" name="bot-field" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <div class="row">
        <button type="button" id="mic">🎤 Dictate</button>
        <button type="submit" class="primary">Send</button>
      </div>
      <p id="askMsg" class="hint" role="status"></p>
    </form>
    <h3>Answered questions</h3>
    <div id="answers"></div>
  </section>
</main>

<script src="topics.js"></script>
<script src="app.js"></script>
</body>
</html>
