name: Tell search engines about changed pages

# After a change reaches main, Netlify publishes it in about a minute. This then tells Bing, Yandex and the
# other IndexNow search engines (Bing also feeds ChatGPT search and Copilot) which pages changed, using the
# dates build.py keeps in blog-copy/tools/lastmod.json. Run it by hand to send every page.
on:
  push:
    branches: [ "main" ]
    paths: [ "blog-copy/tools/lastmod.json" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    name: Send changed pages to IndexNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Netlify to publish
        run: sleep 180
      - name: Send
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, urllib.request
          site = "https://budapesthungry.com"
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', open("blog-copy/tools/build.py", encoding="utf-8").read()).group(1)
          now = json.load(open("blog-copy/tools/lastmod.json", encoding="utf-8"))
          before = {}
          if os.environ.get("BEFORE", "").strip("0"):
              try:
                  before = json.loads(subprocess.run(["git", "show", os.environ["BEFORE"] + ":blog-copy/tools/lastmod.json"],
                                                     capture_output=True, text=True, check=True).stdout)
              except (subprocess.CalledProcessError, ValueError):
                  before = {}
          paths = [p for p, v in now.items() if before.get(p) != v]
          if not paths:
              print("Nothing changed.")
              raise SystemExit
          urls = [f"{site}/{p}" for p in paths]
          body = json.dumps({"host": "budapesthungry.com", "key": key, "keyLocation": f"{site}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.status, "sent", len(urls), "pages:", *urls, sep="\n")
          EOF
