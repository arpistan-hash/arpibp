<svg viewBox="0 0 600 420" role="img" aria-labelledby="hero-t">
      <title id="hero-t">Stylized cartoon of Arpi, a waiter with messy blond hair and round glasses, talking nonstop with his mouth wide open. One hand holds a wobbling stack of plates, the other a covered dish on a tray, and his ginger dog Tobi sits drooling and barking "Vau!"</title>
      <defs>
        <pattern id="hero-chk" width="32" height="32" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#e8452c"/><rect x="16" y="16" width="16" height="16" fill="#e8452c"/>
        </pattern>
      </defs>

      <!-- backdrop -->
      <rect width="600" height="420" fill="#ffe9c2"/>
      <circle cx="235" cy="196" r="150" fill="#ffc94d"/>
      <circle cx="235" cy="196" r="168" fill="none" stroke="#ffc94d" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
      <circle cx="176" cy="84" r="5" fill="#e8452c"/>
      <circle cx="462" cy="64" r="8" fill="none" stroke="#12a594" stroke-width="4"/>
      <polygon points="570,28 580,48 560,48" fill="#12a594" stroke="#1b1f3b" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="22" cy="150" r="6" fill="#12a594"/>
      <circle cx="572" cy="170" r="6" fill="#e8452c"/>

      <!-- tablecloth floor -->
      <rect y="386" width="600" height="34" fill="#fffaf0"/>
      <rect y="386" width="600" height="34" fill="url(#hero-chk)"/>
      <line x1="0" y1="386" x2="600" y2="386" stroke="#1b1f3b" stroke-width="4"/>

      <!-- Arpi -->
      <g stroke-linejoin="round" stroke-linecap="round">
        <!-- tray arm (his left, our right) -->
        <path d="M340 346 C372 335 388 305 392 274" fill="none" stroke="#1b1f3b" stroke-width="40"/>
        <path d="M340 346 C372 335 388 305 392 274" fill="none" stroke="#fffaf0" stroke-width="32"/>
        <!-- plates arm (his right, our left) -->
        <path d="M125 345 C100 330 82 305 72 276" fill="none" stroke="#1b1f3b" stroke-width="40"/>
        <path d="M125 345 C100 330 82 305 72 276" fill="none" stroke="#fffaf0" stroke-width="32"/>

        <!-- body -->
        <rect x="213" y="258" width="44" height="50" fill="#f2c096" stroke="#1b1f3b" stroke-width="4"/>
        <path d="M95 420 C95 340 150 300 235 300 C320 300 375 340 375 420 Z" fill="#fffaf0" stroke="#1b1f3b" stroke-width="4"/>
        <path d="M160 322 L212 318 L204 420 L112 420 C114 375 130 340 160 322 Z" fill="#1e2a4a" stroke="#1b1f3b" stroke-width="4"/>
        <path d="M310 322 L258 318 L266 420 L358 420 C356 375 340 340 310 322 Z" fill="#1e2a4a" stroke="#1b1f3b" stroke-width="4"/>
        <circle cx="196" cy="368" r="4" fill="#ffc94d"/><circle cx="196" cy="394" r="4" fill="#ffc94d"/>
        <circle cx="274" cy="368" r="4" fill="#ffc94d"/><circle cx="274" cy="394" r="4" fill="#ffc94d"/>
        <!-- bow tie -->
        <path d="M235 308 L204 294 L204 322 Z" fill="#e8452c" stroke="#1b1f3b" stroke-width="4"/>
        <path d="M235 308 L266 294 L266 322 Z" fill="#e8452c" stroke="#1b1f3b" stroke-width="4"/>
        <circle cx="235" cy="308" r="8" fill="#c43a22" stroke="#1b1f3b" stroke-width="4"/>

        <!-- ears and head -->
        <circle cx="165" cy="198" r="13" fill="#f2c096" stroke="#1b1f3b" stroke-width="4"/>
        <circle cx="305" cy="198" r="13" fill="#f2c096" stroke="#1b1f3b" stroke-width="4"/>
        <ellipse cx="235" cy="190" rx="72" ry="82" fill="#f2c096" stroke="#1b1f3b" stroke-width="4"/>

        <!-- messy hair -->
