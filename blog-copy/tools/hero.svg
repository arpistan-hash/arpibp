        <ellipse cx="392" cy="252" rx="66" ry="10" fill="#cfd6df" stroke="#1b1f3b" stroke-width="4"/>
        <path d="M344 250 C344 196 440 196 440 250 Z" fill="#eef2f6" stroke="#1b1f3b" stroke-width="4"/>
        <circle cx="392" cy="204" r="7" fill="#cfd6df" stroke="#1b1f3b" stroke-width="3.5"/>
        <path d="M358 238 C358 224 370 215 384 213" fill="none" stroke="#fff" stroke-width="4"/>
        <path d="M384 190 q-8 -9 0 -18 q8 -9 0 -18 M402 194 q-8 -9 0 -17 q8 -9 0 -17" fill="none" stroke="#1b1f3b" stroke-width="3.5" opacity="0.45"/>
      </g>

      <!-- Tobi -->
