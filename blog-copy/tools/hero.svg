        <ellipse cx="525" cy="372" rx="44" ry="36" fill="#d9893d" stroke="#1b1f3b" stroke-width="4"/>
        <ellipse cx="553" cy="388" rx="22" ry="17" fill="#c97a2f" stroke="#1b1f3b" stroke-width="3.5"/>
        <ellipse cx="514" cy="380" rx="21" ry="24" fill="#f6e9d6"/>
        <rect x="496" y="386" width="15" height="22" rx="7" fill="#f6e9d6" stroke="#1b1f3b" stroke-width="3.5"/>
        <rect x="518" y="386" width="15" height="22" rx="7" fill="#f6e9d6" stroke="#1b1f3b" stroke-width="3.5"/>
        <ellipse cx="548" cy="316" rx="11" ry="22" transform="rotate(22 548 316)" fill="#a95f22" stroke="#1b1f3b" stroke-width="3.5"/>
        <ellipse cx="492" cy="298" rx="10" ry="20" transform="rotate(-28 492 298)" fill="#a95f22" stroke="#1b1f3b" stroke-width="3.5"/>
        <circle cx="517" cy="324" r="32" fill="#d9893d" stroke="#1b1f3b" stroke-width="4"/>
        <ellipse cx="500" cy="334" rx="20" ry="14" fill="#f6e9d6" stroke="#1b1f3b" stroke-width="3.5"/>
        <circle cx="486" cy="328" r="6" fill="#2a1a10" stroke="none"/>
        <path d="M493 343 q6 14 16 4 Z" fill="#ff8fa3" stroke="#1b1f3b" stroke-width="2.5"/>
        <ellipse cx="499" cy="360" rx="3" ry="5" fill="#bfe3f5" stroke="none"/>
        <circle cx="508" cy="313" r="7" fill="#fff" stroke="#1b1f3b" stroke-width="2.5"/>
        <circle cx="530" cy="315" r="7" fill="#fff" stroke="#1b1f3b" stroke-width="2.5"/>
        <circle cx="505" cy="309" r="3.5" fill="#2a1a10" stroke="none"/><circle cx="527" cy="311" r="3.5" fill="#2a1a10" stroke="none"/>
      </g>

      <!-- speech bubbles: he does not stop -->
      <g stroke="#1b1f3b" stroke-width="3" stroke-linejoin="round">
        <rect x="10" y="22" width="164" height="40" rx="18" fill="#fff"/>
        <polygon points="118,60 140,60 148,84" fill="#fff"/>
        <rect x="119" y="58" width="21" height="5" fill="#fff" stroke="none"/>
        <rect x="200" y="12" width="236" height="42" rx="18" fill="#fff"/>
        <polygon points="262,52 284,52 274,76" fill="#fff"/>
        <rect x="263" y="50" width="21" height="5" fill="#fff" stroke="none"/>
        <rect x="396" y="86" width="190" height="40" rx="18" fill="#fff"/>
        <polygon points="398,98 398,116 374,112" fill="#fff"/>
        <rect x="395" y="99" width="5" height="16" fill="#fff" stroke="none"/>
        <rect x="456" y="236" width="96" height="36" rx="15" fill="#fff"/>
        <polygon points="486,270 506,270 498,292" fill="#fff"/>
        <rect x="487" y="268" width="19" height="5" fill="#fff" stroke="none"/>
      </g>
      <g text-anchor="middle" fill="#0e1b26" style="font-family: var(--font-display); font-weight: 800; font-size: 19px;">
        <text x="92" y="49">Blah blah blah&#8230;</text>
        <text x="318" y="39">&#8230;and ANOTHER thing!</text>
        <text x="491" y="112">Also, goulash!</text>
        <text x="504" y="261" style="font-size: 20px;">Vau!</text>
      </g>
    </svg>