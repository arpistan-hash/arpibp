        <path d="M236 72 q-4 -18 -22 -24 M276 80 q10 -16 28 -14 M150 146 q-18 -4 -26 6 M326 128 q16 -6 24 4 M200 84 q-14 -10 -12 -26" fill="none" stroke="#1b1f3b" stroke-width="4"/>

