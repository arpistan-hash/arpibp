        <circle cx="262" cy="192" r="20" fill="#cfe6f5" fill-opacity="0.55" stroke="#1b1f3b" stroke-width="4.5"/>
        <path d="M228 190 Q235 183 242 190 M188 190 L168 186 M282 190 L302 186" fill="none" stroke="#1b1f3b" stroke-width="4.5"/>
        <path d="M196 182 q6 -5 12 -4" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
        <path d="M250 182 q6 -5 12 -4" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
        <circle cx="212" cy="195" r="4.5" fill="#2a1a10" stroke="none"/><circle cx="266" cy="195" r="4.5" fill="#2a1a10" stroke="none"/>
        <path d="M189 160 Q207 149 224 159 M246 159 Q264 147 281 158" fill="none" stroke="#7a5a2a" stroke-width="4.5"/>

        <!-- nose, cheeks, loud open mouth -->
        <path d="M236 204 q-9 19 3 23" fill="none" stroke="#1b1f3b" stroke-width="3.5"/>
        <circle cx="190" cy="230" r="9" fill="#ff9f8a" opacity="0.55" stroke="none"/>
        <circle cx="280" cy="230" r="9" fill="#ff9f8a" opacity="0.55" stroke="none"/>
        <path d="M205 238 Q235 292 265 238 Q235 230 205 238 Z" fill="#7a2b2b" stroke="#1b1f3b" stroke-width="4"/>
        <path d="M210 240 Q235 234 260 240 L257 249 Q235 244 213 249 Z" fill="#fff" stroke="none"/>
        <ellipse cx="235" cy="257" rx="13" ry="6" fill="#ff8fa3" stroke="none"/>
        <path d="M194 252 l-16 -7 M276 252 l16 -7 M198 267 l-15 5 M272 267 l15 5" fill="none" stroke="#1b1f3b" stroke-width="3.5"/>

        <!-- wobbling stack of plates -->
        <circle cx="72" cy="268" r="14" fill="#f2c096" stroke="#1b1f3b" stroke-width="4"/>
        <g fill="#fffaf0" stroke="#1b1f3b" stroke-width="3.5">
          <ellipse cx="70" cy="254" rx="52" ry="10"/>
          <ellipse cx="66" cy="240" rx="52" ry="10"/>
          <ellipse cx="75" cy="226" rx="52" ry="10"/>
          <ellipse cx="67" cy="212" rx="52" ry="10"/>
          <ellipse cx="72" cy="198" rx="52" ry="10"/>
        </g>
        <g fill="none" stroke="#12a594" stroke-width="2.5">
          <ellipse cx="70" cy="254" rx="37" ry="6"/><ellipse cx="66" cy="240" rx="37" ry="6"/>
          <ellipse cx="75" cy="226" rx="37" ry="6"/><ellipse cx="67" cy="212" rx="37" ry="6"/>
          <ellipse cx="72" cy="198" rx="37" ry="6"/>
        </g>
        <path d="M10 188 l-8 -7 M134 188 l8 -7 M6 206 l-5 0 M138 206 l6 0" fill="none" stroke="#1b1f3b" stroke-width="3.5"/>

        <!-- covered dish on a tray -->
