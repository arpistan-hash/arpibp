<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Arpi</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root { --ink: #1b1f3b; --bg: #fff3dc; --card: #fffaf0; --muted: #55587a; --shade: #1b1f3b; --p7: #f5a623; --accent: #e8452c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f6ead2; --bg: #15172f; --card: #1d2044; --muted: #b2b5d6; --shade: #000; --accent: #ff7a59; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, sans-serif;
    background-image: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 16%, transparent) 1.2px, transparent 1.6px); background-size: 22px 22px; }
  main { width: min(520px, 100%); text-align: center; background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--shade); padding: 36px 24px 32px; }
  .code { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 800; font-size: clamp(88px, 26vw, 150px); line-height: .9; letter-spacing: -.05em; color: var(--accent); }
  h1 { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 800; font-size: clamp(28px, 7vw, 38px); letter-spacing: -.03em; margin: 14px 0 8px; }
  p { font-size: 18px; line-height: 1.5; color: var(--muted); margin: 0 0 26px; }
  a { display: inline-block; font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 800; font-size: 19px; color: #1b1f3b; background: var(--p7); text-decoration: none; padding: 13px 24px; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--shade); }
  a:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shade); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Hmm, nothing here</h1>
    <p>That page doesn't exist, but the rest of the site does. Tobi checked twice.</p>
    <a href="/">Back to the front page</a>
  </main>
</body>
</html>
