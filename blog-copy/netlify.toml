# Netlify settings for the blog copy: plain static site, no build step.
# The live site publishes this folder (see ../netlify.toml).
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# bullshitsunami.hu (bought at Rackhost) is a second name for the blog:
# send every visit to the same page on budapesthungry.com.
[[redirects]]
  from = "https://bullshitsunami.hu/*"
  to = "https://budapesthungry.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bullshitsunami.hu/*"
  to = "https://budapesthungry.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://bullshitsunami.hu/*"
  to = "https://budapesthungry.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bullshitsunami.hu/*"
  to = "https://budapesthungry.com/:splat"
  status = 301
  force = true
