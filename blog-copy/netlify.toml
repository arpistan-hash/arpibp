# Netlify settings for the blog copy: plain static site, no build step.
# The live site publishes this folder (see ../netlify.toml).
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# bullshittsunami.hu serves the same site as budapesthungry.com (no redirect):
# add it as a domain on the Netlify project and point its DNS there.

# budbud.hu serves Bud Bud (the app in blog-copy/budbud/) at its root, on this same Netlify site, so the board,
# the questions and your phone alerts keep working. To launch: add budbud.hu and www.budbud.hu as domains on the
# Netlify project and point the DNS there. Rules are matched on the host, so the blog domains are not affected.
# Functions stay at /.netlify/functions/*. Unknown paths on budbud.hu show the blog's pages (404 where none exists).
[[redirects]]
  from = "https://www.budbud.hu/*"
  to = "https://budbud.hu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://budbud.hu/"
  to = "/budbud/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://budbud.hu/index.html"
  to = "/budbud/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://budbud.hu/app.js"
  to = "/budbud/app.js"
  status = 200
  force = true

[[redirects]]
  from = "https://budbud.hu/topics.js"
  to = "/budbud/topics.js"
  status = 200
  force = true

[[redirects]]
  from = "https://budbud.hu/style.css"
  to = "/budbud/style.css"
  status = 200
  force = true

[[redirects]]
  from = "https://budbud.hu/sw.js"
  to = "/budbud/sw.js"
  status = 200
  force = true

[[redirects]]
  from = "https://budbud.hu/manifest.webmanifest"
  to = "/budbud/manifest.webmanifest"
  status = 200
