      a: ['Rolling hills in north-west Hungary around the Benedictine Archabbey, founded in 996 and a UNESCO World Heritage site. Monks have made wine here for a thousand years. The cool, breezy climate suits crisp aromatic whites, especially Riesling, and elegant reds.',
          'Dimbes-dombos táj Északnyugat-Magyarországon, a 996-ban alapított bencés főapátság körül, amely UNESCO világörökség. A szerzetesek ezer éve termelnek itt bort. A hűvös, szellős éghajlat a friss, aromás fehéreknek, főleg a rizlingnek, és az elegáns vörösöknek kedvez.'] },
    badacsony: { ll: [17.49, 46.80], f: 'HU', cc: 'HU', n: ['Badacsony', 'Badacsony'], g: 'Kéknyelű · Szürkebarát · Olaszrizling · Pinot noir', s: ['Basalt, basalt tuff and sandy loess', 'Bazalt, bazalttufa és homokos lősz'], c: ['Lake-warmed, sunny', 'A tó melegítette, napos'],
      a: ['Basalt buttes rise straight from the north shore of Lake Balaton. The lake reflects sunlight, the black rock stores heat, and the result is full-bodied, mineral wines. Badacsony is almost the only home of Kéknyelű, the rare "blue stalk" grape, and a proud old wine town.',
          'Bazalthegyek emelkednek közvetlenül a Balaton északi partján. A tó visszaveri a fényt, a fekete kő tárolja a hőt, így telt, ásványos borok születnek. Badacsony a ritka kéknyelű szinte egyetlen otthona, büszke, régi borvidék.'] },
    csopak: { ll: [17.93, 46.97], f: 'HU', cc: 'HU', n: ['Balatonfüred-Csopak', 'Balatonfüred-Csopak'], g: 'Olaszrizling · Rajnai rizling · Kékfrankos', s: ['Marl, limestone and clay', 'Márga, mészkő és agyag'], c: ['Lake-moderated, mild', 'A tó szelídíti, enyhe'],
      a: ['The gentle northern shore of Lake Balaton near the Tihany peninsula. The lake softens winters and cools summer nights, and the star is Olaszrizling, the Welschriesling, which makes some of Hungary\'s most honest, mineral whites with a bitter-almond finish.',
          'A Balaton szelíd északi partja a Tihanyi-félsziget közelében. A tó enyhíti a telet és hűsíti a nyári éjszakákat; a csillag az olaszrizling, amely Magyarország legőszintébb, ásványos fehérborait adja, keserűmandulás utóízzel.'] },
    kali: { ll: [17.62, 46.88], f: 'HU', cc: 'HU', n: ['Balaton Highlands', 'Balaton-felvidék'], g: 'Olaszrizling · Pinot noir · Cabernet Franc · Chardonnay', s: ['Basalt, sandstone and tuff', 'Bazalt, homokkő és tufa'], c: ['Sheltered volcanic basin', 'Védett vulkáni medence'],
      a: ['A wild volcanic landscape north of Lake Balaton, with the Káli Basin\'s "stone seas" of basalt boulders and conical hills like Csobánc crowned by castle ruins. Part of a national park, it grows fresh, smoky, mineral whites and silky, cool-climate reds.',
          'Vad vulkáni táj a Balatontól északra: a Káli-medence bazalt „kőtengerei”, a várromokkal koronázott kúpos hegyek, mint a Csobánc. Nemzeti parkban fekszik, friss, füstös, ásványos fehéreket és selymes, hűvös klímájú vöröseket terem.'] },
    southbalaton: { ll: [17.67, 46.77], f: 'HU', cc: 'HU', n: ['South Balaton', 'Dél-Balaton'], g: 'Chardonnay · Pinot gris · Cabernet · Rajnai rizling', s: ['Loess and sand, small volcanic hills', 'Lősz és homok, kis vulkáni dombok'], c: ['Warm, sunny southern shore', 'Meleg, napos déli part'],
      a: ['The warm, sunny southern side of Lake Balaton around Balatonboglár and Balatonlelle. Gentler hills and the lake\'s mild climate ripen Chardonnay beautifully and give round, easy reds too, and the region is also Hungary\'s summer holiday playground.',
          'A Balaton melegebb, napos déli oldala Balatonboglár és Balatonlelle körül. A lágyabb dombok és a tó enyhe éghajlata remekül érleli a chardonnay-t, de teltebb, könnyen iható vörösöket is terem; a vidék a magyar nyaralás szíve is.'] },
    etyek: { ll: [18.75, 47.45], f: 'HU', cc: 'HU', n: ['Etyek-Buda', 'Etyek-Buda'], g: 'Chardonnay · Sauvignon blanc · Pinot noir', s: ['Limestone and loess', 'Mészkő és lősz'], c: ['One of the coolest regions', 'Az ország egyik leghűvösebb vidéke'],
      a: ['Just 30 km west of Budapest, Etyek is one of Hungary\'s coolest wine regions and the heartland of its sparkling wine. Limestone and loess hills with a long, gentle ripening season suit elegant Chardonnay, aromatic Sauvignon Blanc and Pinot Noir.',
          'Budapesttől alig 30 km-re nyugatra, Etyek az ország egyik leghűvösebb borvidéke és a hazai pezsgőkészítés szíve. A mészkő és lősz dombokon hosszú, lassú érés zajlik, ami az elegáns chardonnay-nak, az aromás sauvignon blanc-nak és a pinot noir-nak kedvez.'] },
    szekszard: { ll: [18.70, 46.35], f: 'HU', cc: 'HU', n: ['Szekszárd', 'Szekszárd'], g: 'Kadarka · Kékfrankos · Cabernet · Merlot', s: ['Deep loess over clay', 'Mély lősz, agyagos alapon'], c: ['Warm, almost Mediterranean', 'Meleg, mediterrán jellegű'],
      a: ['A sunny, hilly region in the south, west of the Danube, with deep loess valleys and a long history of red wine. It is the heartland of Kadarka, the silky, peppery native red, and makes its own Szekszárdi Bikavér, often more rounded and plush than Eger\'s.',
          'Napos, dimbes-dombos déli borvidék a Dunától nyugatra, mély lösz-völgyekkel és hosszú vörösbor-hagyománnyal. A kadarka, a selymes, borsos őshonos vörös fő hazája, saját Szekszárdi Bikavért is készít, amely gyakran lágyabb, bársonyosabb az egrinél.'] },
    villany: { ll: [18.45, 45.85], f: 'HU', cc: 'HU', n: ['Villány', 'Villány'], g: 'Cabernet Franc · Cabernet Sauvignon · Merlot · Portugieser', s: ['Limestone and loess', 'Mészkő és lősz'], c: ['Hungary\'s warmest, Mediterranean feel', 'Az ország legmelegebb, mediterrán hangulatú vidéke'],
      a: ['Hungary\'s southernmost wine region, near the Croatian border, with a warm, almost Mediterranean climate and sunny limestone hills. It is red wine country, famed for Cabernet Franc (the "Villányi Franc" label), Cabernet Sauvignon and Merlot with real depth and polish.',
          'Magyarország legdélibb borvidéke a horvát határ közelében, meleg, szinte mediterrán éghajlattal és napos mészköves dombokkal. Vörösbor-vidék, híres a cabernet franc-járól („Villányi Franc”), valamint mély, csiszolt cabernet sauvignon-járól és merlot-járól.'] },
    champagne: { ll: [4.00, 49.05], f: 'FR', cc: 'FR', n: ['Champagne', 'Champagne'], g: 'Pinot noir · Meunier · Chardonnay', s: ['Chalk, with chalk cellars', 'Kréta, kréta-pincékkel'], c: ['Cool, northern, marginal', 'Hűvös, északi, határeset'],
      a: ['About 150 km east of Paris, the northernmost great wine region of France. Cool chalk hills around Reims and Épernay, with miles of chalk cellars underneath, give the high acidity needed for the traditional method. Only sparkling wine made here may be called Champagne.',
          'Párizstól mintegy 150 km-re keletre, Franciaország legészakibb nagy borvidéke. A Reims és Épernay körüli hűvös krétadombok, alattuk kilométernyi krétapincével, adják a hagyományos módszerhez szükséges magas savat. Csak az itt készült pezsgő viselheti a Champagne nevet.'] },
    sancerre: { ll: [2.84, 47.33], f: 'FR', cc: 'FR', n: ['Sancerre, Loire Valley', 'Sancerre, Loire-völgy'], g: 'Sauvignon blanc · Pinot noir', s: ['Limestone, flint and clay', 'Mészkő, kova és agyag'], c: ['Cool continental', 'Hűvös kontinentális'],
      a: ['A hilltop wine town above the upper Loire in central France, the garden of France. Sauvignon Blanc here is crisp, chalky and flinty rather than tropical: the soils (limestone pebbles, flint and clay) shape its style as much as the grape.',
          'Hegytetői borváros a Loire felső folyásánál, Közép-Franciaországban. A sauvignon blanc itt nem trópusi, hanem ropogós, krétás és kovás; a talaj (mészkő, kova és agyag) legalább annyira formálja a stílust, mint a fajta.'] },
    chablis: { ll: [3.80, 47.81], f: 'FR', cc: 'FR', n: ['Chablis, Burgundy', 'Chablis, Burgundia'], g: 'Chardonnay', s: ['Kimmeridgian limestone and fossil oyster shells', 'Kimmeridge-i mészkő, fosszilis kagylókkal'], c: ['Cool, northern Burgundy', 'Hűvös, észak-burgundiai'],
      a: ['The northernmost corner of Burgundy, near the Serein river. Here the soil is an ancient seabed of Kimmeridgian limestone full of tiny fossil oysters, which is why Chablis, always Chardonnay, tastes steely, lemony and faintly of the sea.',
          'Burgundia legészakibb csücske a Serein folyó mentén. A talaj egy ősi tengerfenék, kimmeridge-i mészkő apró fosszilis kagylókkal, ezért ízlik a Chablis, amely mindig chardonnay, acélosnak, citromosnak és enyhén tengerinek.'] },
    cotebeaune: { ll: [4.78, 46.99], f: 'FR', cc: 'FR', n: ['Côte de Beaune, Burgundy', 'Côte de Beaune, Burgundia'], g: 'Chardonnay · Pinot noir', s: ['Limestone and marl', 'Mészkő és márga'], c: ['Cool continental, east-facing slopes', 'Hűvös kontinentális, keleti lejtők'],
      a: ['The southern half of Burgundy\'s Golden Slope. Puligny-Montrachet and Meursault make some of the world\'s greatest Chardonnay; Pommard and Volnay make firm and perfumed Pinot Noir. Every tiny plot, or climat, is mapped and named; the Climats of Burgundy are UNESCO-listed.',
          'Burgundia Aranydombjának déli fele. Puligny-Montrachet és Meursault a világ legnagyobb chardonnay-it adja, Pommard és Volnay pedig határozott, illatos pinot noir-t. Minden apró parcella, vagyis climat, névvel és térképpel rendelkezik; Burgundia climat-jai az UNESCO világörökség részei.'] },
    cotenuits: { ll: [4.95, 47.15], f: 'FR', cc: 'FR', n: ['Côte de Nuits, Burgundy', 'Côte de Nuits, Burgundia'], g: 'Pinot noir', s: ['Stony limestone and marl', 'Köves mészkő és márga'], c: ['Cool continental', 'Hűvös kontinentális'],
      a: ['The northern half of the Golden Slope and Pinot Noir\'s spiritual home. The village of Vosne-Romanée, where the most revered and expensive red Burgundies are grown, lies here, on thin, stony limestone soils.',
          'Az Aranydomb északi fele és a pinot noir szellemi hazája. Itt található Vosne-Romanée, ahol a legtiszteltebb és legdrágább vörös burgundik teremnek vékony, köves mészkőtalajon.'] },
    provence: { ll: [6.48, 43.47], f: 'FR', cc: 'FR', n: ['Provence', 'Provence'], g: 'Grenache · Cinsault · Syrah · Mourvèdre', s: ['Limestone and crystalline rock', 'Mészkő és kristályos kőzet'], c: ['Hot, sunny, Mediterranean, with the Mistral wind', 'Forró, napos, mediterrán, a mistral széllel'],
      a: ['The sun-soaked Mediterranean coast and hills of south-east France, and the world capital of dry, pale rosé. Sea breezes and the Mistral wind keep the vines healthy, and Provençal rosé is the benchmark for delicate, fruity pink wine.',
          'Dél-Franciaország napsütötte mediterrán partja és dombjai, a száraz, halvány rozé világfővárosa. A tengeri szellő és a mistral egészségesen tartja a szőlőt, a provence-i rozé pedig a finom, gyümölcsös rozék etalonja.'] },
    pauillac: { ll: [-0.75, 45.20], f: 'FR', cc: 'FR', n: ['Pauillac, Bordeaux', 'Pauillac, Bordeaux'], g: 'Cabernet Sauvignon · Merlot', s: ['Deep gravel', 'Mély kavics'], c: ['Maritime, Gironde estuary', 'Óceáni, a Gironde torkolatánál'],
      a: ['On the left bank of the Gironde estuary in the Médoc, famous for powerful, long-lived Cabernet Sauvignon. Warm gravel banks drain well and store heat. Three of Bordeaux\'s five First Growths live here, alongside Lynch-Bages and Pichon.',
          'A Gironde torkolatának bal partján, a Médocban, erőteljes, hosszú életű cabernet sauvignon-járól híres. A meleg kavicsos dombok jól vezetik a vizet és tárolják a hőt. Bordeaux öt első cru-jából három itt található, Lynch-Bages-zsal és Pichon-nal együtt.'] },
    margaux: { ll: [-0.68, 45.04], f: 'FR', cc: 'FR', n: ['Margaux, Bordeaux', 'Margaux, Bordeaux'], g: 'Cabernet Sauvignon · Merlot', s: ['Light, thin gravel', 'Könnyű, vékony kavics'], c: ['Maritime', 'Óceáni'],
      a: ['The southern Médoc, on the left bank of the Gironde. Thin gravel soils give the most perfumed and delicate wines of the Médoc, with violets and silky tannins, home to Château Palmer and Château Margaux.',
          'A Médoc déli része, a Gironde bal partján. A vékony kavicsos talaj a Médoc legillatosabb, legfinomabb borait adja, ibolyával és selymes tanninokkal; itt található a Château Palmer és a Château Margaux.'] },
    stemilion: { ll: [-0.15, 44.89], f: 'FR', cc: 'FR', n: ['Saint-Émilion, Bordeaux', 'Saint-Émilion, Bordeaux'], g: 'Merlot · Cabernet Franc', s: ['Limestone plateau and clay', 'Mészkő fennsík és agyag'], c: ['Maritime, milder', 'Óceáni, enyhébb'],
      a: ['A medieval hillside town on Bordeaux\'s right bank, UNESCO-listed, where vines grow on a limestone plateau and clay slopes. Merlot leads, with Cabernet Franc, giving rounder, plusher wines than the left bank. Château Angélus is one of the stars.',
          'Középkori dombtetői város Bordeaux jobb partján, UNESCO világörökség, ahol a szőlő mészkő fennsíkon és agyagos lejtőkön nő. A merlot vezet, cabernet franc-nal, a bal partnál kerekebb, teltebb borokat adva. A Château Angélus az egyik csillag.'] },
    chateauneuf: { ll: [4.83, 44.06], f: 'FR', cc: 'FR', n: ['Châteauneuf-du-Pape, Rhône', 'Châteauneuf-du-Pape, Rhône'], g: 'Grenache · Syrah · Mourvèdre', s: ['Large round pebbles (galets) on clay', 'Nagy, kerek kavicsok (galets) agyagon'], c: ['Hot, dry, windy Mediterranean', 'Forró, száraz, szeles mediterrán'],
      a: ['The "pope\'s new castle" near Avignon, where the popes summered in the 14th century. Large round pebbles soak up the sun by day and warm the vines by night, ripening Grenache-led blends with generous, spicy fruit.',
          'A „pápa új kastélya” Avignon közelében, ahol a pápák a 14. században nyaraltak. A nagy, kerek kavicsok nappal magukba szívják a napfényt, éjjel pedig melegítik a tőkéket, így érlelik a grenache-vezette, bő gyümölcsű, fűszeres cuvée-ket.'] },
    rioja: { ll: [-2.5, 42.4], f: 'ES', cc: 'ES', n: ['Rioja', 'Rioja'], g: 'Tempranillo · Garnacha · Graciano', s: ['Clay, limestone and iron-rich clay', 'Agyag, mészkő és vasban gazdag agyag'], c: ['Atlantic and Mediterranean influences', 'Atlanti és mediterrán hatás'],
      a: ['Along the Ebro river in northern Spain, Spain\'s best-known red wine region. Tempranillo is aged in oak and bottle for years before release, so a Gran Reserva comes to the table already mellow, with dried cherry, leather and vanilla. Marqués de Murrieta was founded in 1852.',
          'Észak-Spanyolországban, az Ebro mentén, az ország legismertebb vörösbor-vidéke. A tempranillo-t éveken át érlelik tölgyfában és palackban, így a Gran Reserva már lágyan kerül az asztalra, szárított cseresznyével, bőrrel és vaníliával. A Marqués de Murrieta 1852-ben alakult.'] },
    ribera: { ll: [-3.70, 41.65], f: 'ES', cc: 'ES', n: ['Ribera del Duero', 'Ribera del Duero'], g: 'Tempranillo (Tinto fino)', s: ['Clay, limestone and sand', 'Agyag, mészkő és homok'], c: ['High plateau, big day-night swings', 'Magas fennsík, nagy napi hőingás'],
      a: ['A high plateau at 800 m on the Duero river in Castile and León, with scorching days and cold nights. These swings give concentrated, dark Tempranillo with fresh acidity. Vega Sicilia, founded in 1864, is Spain\'s most legendary estate.',
          'Magas, 800 méteres fennsík a Duero mentén, Kasztília és León tartományban, perzselő nappalokkal és hideg éjszakákkal. A hőingás sűrű, sötét tempranillo-t ad friss savakkal. Az 1864-ben alapított Vega Sicilia Spanyolország legendás birtoka.'] },
    riasbaixas: { ll: [-8.70, 42.40], f: 'ES', cc: 'ES', n: ['Rías Baixas, Galicia', 'Rías Baixas, Galícia'], g: 'Albariño', s: ['Granite and sand', 'Gránit és homok'], c: ['Cool, wet, Atlantic', 'Hűvös, esős, atlanti'],
      a: ['Galicia\'s green Atlantic coast in north-west Spain, where the sea cuts deep inlets (the "Lower Estuaries"). Vines are trained high on pergolas against humidity. Albariño here is zesty and saline and made for seafood.',
          'Galícia zöld atlanti partja Északnyugat-Spanyolországban, ahol a tenger mély öblöket vág (a „Rías Baixas” alsó torkolatot jelent). A szőlőt a nedvesség ellen magas lugasokon nevelik. Az albariño itt üde és sós, tenger gyümölcseihez teremtették.'] },
    chianti: { ll: [11.25, 43.50], f: 'IT', cc: 'IT', n: ['Chianti Classico, Tuscany', 'Chianti Classico, Toszkána'], g: 'Sangiovese · Cabernet · Merlot', s: ['Galestro (schist-like clay) and alberese limestone', 'Galestro (palás agyag) és alberese mészkő'], c: ['Warm days, cool nights, hills', 'Meleg nappalok, hűvös éjszakák, dombok'],
      a: ['The hills between Florence and Siena, marked by the black rooster on the bottle neck. Sangiovese rules here, and the Antinori family has made wine in Tuscany for around 600 years. Tignanello, born here, started the Super Tuscan revolution.',
          'A Firenze és Siena közötti dombok, amelyeket a palacknyakon a fekete kakas jelöl. Itt a sangiovese az úr, az Antinori család mintegy 600 éve készít bort Toszkánában. Az itt született Tignanello indította el a Super Tuscan forradalmat.'] },
    montalcino: { ll: [11.49, 43.05], f: 'IT', cc: 'IT', n: ['Montalcino, Tuscany', 'Montalcino, Toszkána'], g: 'Sangiovese (Brunello)', s: ['Clay, limestone and galestro', 'Agyag, mészkő és galestro'], c: ['Warm and drier than Chianti', 'Melegebb és szárazabb a Chiantinél'],
      a: ['A walled hill town south of Siena. Brunello is 100% Sangiovese and by law cannot be released until at least five years after harvest, so it comes mature and complex. Warm, dry summers make it fuller than Chianti.',
          'Falvakkal körülvett dombtetői város Sienától délre. A Brunello 100% sangiovese, és törvény szerint csak legalább öt évvel a szüret után hozható forgalomba, így érett, összetett. A meleg, száraz nyarak teltebbé teszik a Chiantinél.'] },
    cortona: { ll: [11.99, 43.28], f: 'IT', cc: 'IT', n: ['Cortona, Tuscany', 'Cortona, Toszkána'], g: 'Merlot · Syrah · Sangiovese', s: ['Sandy loam and clay', 'Homokos vályog és agyag'], c: ['Warm, sunny', 'Meleg, napos'],
      a: ['The sunny Valdichiana valley in eastern Tuscany, overlooked by the Etruscan hill town of Cortona. A warm, open landscape that suits Merlot and Syrah, which here make plush, polished wines.',
          'A napos Valdichiana-völgy Kelet-Toszkánában, amelyet az etruszk eredetű Cortona dombtetői városa néz. Meleg, nyitott táj, a merlot-nak és a syrah-nak kedvez, itt bársonyos, csiszolt borokat adnak.'] },
    bolgheri: { ll: [10.60, 43.22], f: 'IT', cc: 'IT', n: ['Bolgheri, Tuscany', 'Bolgheri, Toszkána'], g: 'Cabernet · Merlot · Vermentino', s: ['Stony clay and sand near the sea', 'Köves agyag és homok a tenger közelében'], c: ['Coastal, sea breezes', 'Tengerparti, tengeri szellő'],
      a: ['On the Tuscan coast, a flat strip of vineyards behind a famous avenue of cypress trees. Bolgheri is the birthplace of the Super Tuscans, with Cabernet and Merlot in place of local Sangiovese, and also makes fresh, saline Vermentino.',
          'A toszkán tengerpart, ciprusfasorral szegélyezett, sík szőlősáv. Bolgheri a Super Tuscan-ok szülőhelye, ahol a helyi sangiovese helyett cabernet és merlot terem; friss, sós vermentino-t is készít.'] },
    barolo: { ll: [7.95, 44.60], f: 'IT', cc: 'IT', n: ['Barolo, Piedmont', 'Barolo, Piemont'], g: 'Nebbiolo', s: ['Calcareous marl, sand', 'Meszes márga, homok'], c: ['Foggy autumns, alpine foothills', 'Ködös őszök, alpesi előhegység'],
      a: ['The Langhe hills of Piedmont, south-west of Alba, in the foothills of the Alps. Nebbiolo, named for the autumn fog (nebbia), makes the "wine of kings": pale in colour yet powerful in tannin, with rose, tar and cherry. The landscape is UNESCO-listed.',
          'A piemonti Langhe dombjai Albától délnyugatra, az Alpok lábánál. A nebbiolo, amely az őszi ködről (nebbia) kapta nevét, a „királyok borát” adja: színe halvány, tanninja erős, rózsa, kátrány és cseresznye jegyekkel. A táj UNESCO világörökség.'] },
    soave: { ll: [11.25, 45.42], f: 'IT', cc: 'IT', n: ['Soave, Veneto', 'Soave, Veneto'], g: 'Garganega', s: ['Volcanic basalt and limestone', 'Vulkáni bazalt és mészkő'], c: ['Mild and sunny', 'Enyhe, napos'],
      a: ['East of Verona, under a medieval walled town. In the steep Classico hills the soil is old volcanic basalt, giving Garganega a flowery, almondy character with a gentle mineral finish.',
          'Veronától keletre, egy középkori fallal körülvett város alatt. A meredek Classico dombokon az ősi vulkáni bazalt adja a garganegának virágos, mandulás karaktert, enyhén ásványos utóízzel.'] },
    mosel: { ll: [7.12, 50.04], f: 'CE', cc: 'DE', n: ['Mosel', 'Mosel'], g: 'Riesling', s: ['Steep slate slopes', 'Meredek palalejtők'], c: ['Cool, river-warmed', 'Hűvös, a folyó melegíti'],
      a: ['A winding river in western Germany with some of the steepest vineyards in the world, many too steep for machines. Dark slate soaks up sun and releases it at night, so Riesling here is racy, floral, and smoky, with piercing acidity.',
          'Nyugat-Németország kanyargó folyója, a világ legmeredekebb szőlői közül sok gép számára járhatatlan. A sötét pala nappal szívja a napot és éjjel adja le, így a rizling itt élénk, virágos, füstös, éles savakkal.'] },
    kamptal: { ll: [15.65, 48.45], f: 'CE', cc: 'AT', n: ['Kamptal, Austria', 'Kamptal, Ausztria'], g: 'Grüner Veltliner · Riesling', s: ['Loess, gneiss and ancient terraces', 'Lősz, gneisz és ősi teraszok'], c: ['Warm Pannonian days, cool alpine nights', 'Meleg pannon nappalok, hűvös alpesi éjszakák'],

    pannonhalma: ['The Archabbey\'s monks have been making wine here for around a thousand years, and visitors can tour the cellar and the old abbey library.', 'A főapátság szerzetesei nagyjából ezer éve készítenek itt bort, a látogatók a pincét és a régi apátsági könyvtárat is megnézhetik.'],
    badacsony: ['"Szürkebarát", the Hungarian name for Pinot Gris, means "grey friar", after the grey robes of the monks who grew it.', 'A „szürkebarát”, a pinot gris magyar neve, a szőlőt termesztő szerzetesek szürke csuhájára utal.'],

    kali: ['Csobánc is a steep volcanic cone crowned by the ruins of a medieval castle, with a view over the Balaton Uplands.', 'A Csobánc meredek vulkanikus kúp, tetején középkori vár romjaival, kilátással a Balaton-felvidékre.'],

    etyek: ['Etyek is nicknamed "Hollywood in Etyek", because a large film studio stands among its vineyards.', 'Etyeket „etyeki Hollywoodnak” is hívják, mert a szőlők között egy nagy filmstúdió áll.'],
    szekszard: ['The poet Mihály Babits, one of Hungary\'s greatest, was born in Szekszárd and wrote about its hills and wine.', 'Babits Mihály, Magyarország egyik legnagyobb költője Szekszárdon született, és verseiben megénekelte a dombokat és a bort.'],
    villany: ['Villány is the warmest and sunniest region in Hungary, so its grapes ripen earlier than anywhere else in the country.', 'Villány az ország legmelegebb és legnaposabb borvidéke, ezért itt érik be a szőlő a leghamarabb.'],
    champagne: ['Many of Champagne\'s cellars are old Roman chalk quarries, cool and damp at about 10 to 12 °C all year round.', 'A champagne-i pincék közül sok egykori római kréta-bánya, egész évben hűvösek és nedvesek, nagyjából 10–12 fokosak.'],
    sancerre: ['Across the Loire from Sancerre, the village of Pouilly-sur-Loire makes Pouilly-Fumé from the very same grape, Sauvignon Blanc.', 'A Loire túlpartján Pouilly-sur-Loire faluban ugyanabból a szőlőből, sauvignon blanc-ból készítik a Pouilly-Fumé-t.'],
    chablis: ['The tiny fossil oysters in Chablis\'s soil are a good hint: the wine is a classic match for fresh oysters.', 'A chablis-i talaj apró fosszilis kagylói sokat sejtetnek: a bor klasszikus párja a friss osztrigának.'],
    cotebeaune: ['Every November the Hospices de Beaune holds a charity wine auction, a tradition that has run since 1859.', 'Minden novemberben jótékonysági borárverést tartanak a beaune-i Hospices-ben, ez a hagyomány 1859 óta él.'],
    cotenuits: ['The Romanée-Conti vineyard, near Vosne, is just under two hectares, yet its wine is among the most expensive in the world.', 'A Vosne melletti Romanée-Conti szőlő alig két hektáros, a bora mégis a világ legdrágábbjai közé tartozik.'],
    provence: ['Provence has been making rosé for around 2,600 years, since Greek settlers planted vines near Marseille.', 'Provence-ban nagyjából 2600 éve készítenek rozét, amióta görög telepesek szőlőt ültettek Marseille környékén.'],
    pauillac: ['The famous 1855 Bordeaux classification has been changed only once: Mouton Rothschild, in Pauillac, was promoted to First Growth in 1973.', 'A híres, 1855-ös bordeaux-i osztályozáson csak egyszer változtattak: a pauillac-i Mouton Rothschild 1973-ban első cru lett.'],
    margaux: ['Château Palmer is named after the British general Charles Palmer, who bought the estate in 1814.', 'A Château Palmer Charles Palmer brit tábornokról kapta a nevét, aki 1814-ben megvásárolta a birtokot.'],
    stemilion: ['Saint-Émilion hides an underground church carved out of a single block of limestone, and the town has been UNESCO-listed since 1999.', 'Saint-Émilion alatt egyetlen mészkőtömbből kivájt földalatti templom rejtőzik, a város 1999 óta UNESCO világörökség.'],
    chateauneuf: ['Bottles from Châteauneuf-du-Pape are embossed with the crossed keys and papal crown, a nod to the popes of Avignon.', 'A châteauneuf-du-pape-i palackokba az avignoni pápákra utaló keresztbe tett kulcsok és pápai korona van dombornyomva.'],
    rioja: ['Rioja was Spain\'s first region to be awarded the top DOCa quality status, in 1991.', 'Rioja volt Spanyolország első borvidéke, amely 1991-ben megkapta a legmagasabb, DOCa minőségi besorolást.'],
    ribera: ['Ribera del Duero can see frost as late as May, yet the same vineyards can reach 35 °C in summer.', 'A Ribera del Duero-ban még májusban is lehet fagy, nyáron mégis 35 fok fölé is kúszhat a hőmérséklet ugyanazokon a szőlőkön.'],
    riasbaixas: ['Many Rías Baixas vines are trained high on granite pergolas, so the grapes hang in the sea breeze, away from the damp ground.', 'Sok Rías Baixas-i tőkét magas gránit lugasokon nevelnek, így a szőlő a tengeri szélben, a nedves talajtól távol lóg.'],
    chianti: ['Legend says Florence and Siena settled their border by a race between two knights set off at the first crow of a rooster, which is why the black rooster is Chianti Classico\'s symbol.', 'A legenda szerint Firenze és Siena a határt két lovag versenyével döntötte el, amelyet a kakas első kukorékolása indított el, innen a fekete kakas a Chianti Classico jelképe.'],
    montalcino: ['Brunello was developed in the 19th century by Ferruccio Biondi Santi, who believed in isolating the best Sangiovese clone.', 'A Brunellót a 19. században Ferruccio Biondi Santi dolgozta ki, aki a legjobb sangiovese klónjának kiválasztásában hitt.'],
    cortona: ['Cortona is the hill town made famous worldwide by the book and film "Under the Tuscan Sun".', 'Cortona az a dombtetői város, amelyet a „Toszkán nap alatt” című könyv és film tett világszerte ismertté.'],
    bolgheri: ['Bolgheri\'s famous avenue of cypress trees, almost five kilometres long, was inspired by a poem by Giosuè Carducci.', 'Bolgheri híres, majdnem öt kilométeres ciprusfasorát Giosuè Carducci egyik verse ihlette.'],
    barolo: ['By law, Barolo must age at least 38 months, 18 of them in wood, before it may be sold.', 'A törvény szerint a Barolót legalább 38 hónapig kell érlelni, ebből 18 hónapot fában, mielőtt eladható.'],
    soave: ['Above the town of Soave stands a medieval castle built by the Scaliger family, who ruled Verona.', 'Soave városa fölött a Veronát uraló Scaliger család építette középkori vár áll.'],
    mosel: ['The Calmont, near Bremm on the Mosel, is often called Europe\'s steepest vineyard, with slopes of around 65 degrees.', 'A Mosel melletti Bremm közelében lévő Calmontot gyakran Európa legmeredekebb szőlőjének nevezik, lejtése nagyjából 65 fok.'],
    kamptal: ['Kamptal\'s famous Heiligenstein vineyard is made of "desert sandstone", laid down around 270 million years ago.', 'A Kamptal híres Heiligenstein dűlője „sivatagi homokkőből” áll, amely nagyjából 270 millió éve rakódott le.'],
    wachau: ['Wachau\'s quality names come from nature: Steinfeder is a feathery grass, Federspiel a falconry term, and Smaragd the emerald lizard that sunbathes on the terraces.', 'A wachaui minőségi elnevezések a természetből erednek: a Steinfeder egy tollas fűféle, a Federspiel solymász kifejezés, a Smaragd pedig a teraszokon napozó smaragdgyík.'],
    burgenland: ['Burgenland belonged to the Kingdom of Hungary until 1921, which is why Blaufränkisch is known here, as in Hungary, by names like Kékfrankos.', 'Burgenland 1921-ig a Magyar Királysághoz tartozott, ezért ismerik itt is a blaufränkischt, akárcsak Magyarországon, kékfrankos néven.'],
    marlborough: ['Marlborough grows most of New Zealand\'s wine grapes, and the bay that gave Cloudy Bay its name was named by Captain Cook in 1770.', 'Marlborough termeli az új-zélandi borszőlő nagy részét, a Cloudy Bay nevét adó öblöt pedig Cook kapitány nevezte el 1770-ben.'],
