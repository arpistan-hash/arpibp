<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Blog visitors</title>
<meta name="theme-color" content="#15172f">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/inbox.css">
<style>
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stat-row div { background: var(--card, #20234a); border-radius: 14px; padding: 12px; text-align: center; }
  .stat-row b { display: block; font-size: 30px; line-height: 1.1; }
  .stat-row span { font-size: 16px; opacity: .8; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; margin: 8px 0 4px; }
  .bars i { flex: 1; background: #ffc94d; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bars-cap { display: flex; justify-content: space-between; font-size: 16px; opacity: .8; }
  .top { list-style: none; padding: 0; margin: 0 0 18px; }
  .top li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 18px; }
  .top li span { overflow-wrap: anywhere; }
  h2 { font-size: 20px; margin: 22px 0 6px; }
  .note { font-size: 16px; opacity: .8; }
</style>
</head>
<body>
<main>
  <header><h1>Blog visitors 📈</h1></header>
  <div id="app"><p class="hint">Loading...</p></div>
  <footer>Counted without cookies: only daily totals, nothing personal. Your own phone isn't counted. <a href="inbox.html">Back to the inbox</a>.</footer>
</main>
<script>
(function () {
  "use strict";
  var KEY_STORE = "arpi-inbox-key", app = document.getElementById("app"), key = "";
  try { key = decodeURIComponent(location.hash.slice(1)) || localStorage.getItem(KEY_STORE) || ""; if (key) localStorage.setItem(KEY_STORE, key); } catch (e) {}
  if (location.hash) history.replaceState(null, "", location.pathname);
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  if (!key) { app.innerHTML = '<p class="bad">Open your inbox link once on this phone first, then come back here.</p>'; return; }
  var NAMES = { "google.com": "Google", "google.hu": "Google", "bing.com": "Bing", "pinterest.com": "Pinterest", "pin.it": "Pinterest",
    "reddit.com": "Reddit", "out.reddit.com": "Reddit", "facebook.com": "Facebook", "m.facebook.com": "Facebook", "l.facebook.com": "Facebook",
    "lm.facebook.com": "Facebook", "instagram.com": "Instagram", "l.instagram.com": "Instagram", "t.co": "X (Twitter)", "tiktok.com": "TikTok",
    "chatgpt.com": "ChatGPT", "perplexity.ai": "Perplexity", "duckduckgo.com": "DuckDuckGo", "tripadvisor.com": "TripAdvisor", "youtube.com": "YouTube", "copilot.microsoft.com": "Copilot", "gemini.google.com": "Gemini", "claude.ai": "Claude" };
  function page(p) {
    if (p === "/") return "Home page";
    return p.replace(/^\/posts\//, "").replace(/\.html$/, "").replace(/-/g, " ");
  }
  // "US" -> "🇺🇸 United States"
  var regionName = null; try { regionName = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
  function country(cc) {
    if (!/^[A-Z]{2}$/.test(cc)) return "Unknown";
    var flag = String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65);
    var name = cc; try { name = regionName ? regionName.of(cc) : cc; } catch (e) {}
    return flag + " " + name;
  }
  function list(rows, fmt, none) {
    if (!rows.length) return '<p class="note">' + none + '</p>';
    return '<ul class="top">' + rows.map(function (r) { return '<li><span>' + esc(fmt(r[0])) + '</span><b>' + r[1] + '</b></li>'; }).join("") + '</ul>';
  }
  fetch("/.netlify/functions/stats?days=30&key=" + encodeURIComponent(key), { cache: "no-store" })
    .then(function (r) { if (r.status === 403) throw new Error("key"); if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) {
      var days = d.days.slice().reverse(), max = Math.max.apply(null, days.map(function (x) { return x.views; }).concat([1]));
      var week = d.days.slice(0, 7).reduce(function (s, x) { return s + x.views; }, 0);
      app.innerHTML =
        '<div class="stat-row"><div><b>' + d.days[0].views + '</b><span>today</span></div><div><b>' + week + '</b><span>7 days</span></div><div><b>' + d.total + '</b><span>30 days</span></div></div>' +
        '<div class="bars" aria-hidden="true">' + days.map(function (x) { return '<i style="height:' + Math.round(x.views / max * 100) + '%" title="' + x.d + ': ' + x.views + '"></i>'; }).join("") + '</div>' +
        '<div class="bars-cap"><span>30 days ago</span><span>today</span></div>' +
        '<h2>Countries</h2>' + list(d.countries || [], country, "No visits yet.") +
        '<h2>Most read pages</h2>' + list(d.pages, page, "No visits yet.") +
        '<h2>Where they came from</h2>' + list(d.refs, function (h) { return NAMES[h] || h; }, "No other sites yet. Most people typed the address or used an app.") +
        '<h2>Source tags</h2>' + list(d.src, function (s) { return s; }, "None yet.");
    })
    .catch(function (e) { app.innerHTML = '<p class="bad">' + (e.message === "key" ? "This phone has an old or wrong key. Open your inbox link again." : "Couldn't load the numbers. Try again in a minute.") + '</p>'; });
})();
</script>
</body>
</html>
