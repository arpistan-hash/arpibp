<title>Lounge Crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar (seat + categories), scrolling menu,
   floating "View order" bar, fixed bottom navigation, bottom sheets for item options. */
:root {
  --bg: #F3F5F2;
  --surface: #FFFFFF;
  --raised: #FAFBF9;
  --fg: #15201D;
  --muted: #5A6A64;
  --line: #DCE3DE;
  --accent: #1E4D44;
  --accent-fg: #FFFFFF;
  --accent-soft: #E2ECE8;
  --brass: #8C6A2F;
  --glass: #3E4F4A;
  --glass-fill: rgba(170, 205, 196, .22);
  --alert: #A83E24;
  --alert-soft: #F8E4DC;
  --ok: #24704A;
  --ok-soft: #DDEFE4;
  --scrim: rgba(10, 16, 14, .5);
  --shadow: 0 10px 30px rgba(15, 30, 25, .14);
  --display: "Bodoni Moda", "Didot", Georgia, serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1413; --surface: #172020; --raised: #1C2725; --fg: #E8EEEB; --muted: #9DADA7; --line: #2A3734;
    --accent: #7FC6B3; --accent-fg: #0B1513; --accent-soft: #1B2E2A; --brass: #D4B272; --glass: #C9D8D3; --glass-fill: rgba(200, 230, 222, .10);
    --alert: #EA8E70; --alert-soft: #3B241C; --ok: #72CF97; --ok-soft: #173220;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #172020; --raised: #1C2725; --fg: #E8EEEB; --muted: #9DADA7; --line: #2A3734;
  --accent: #7FC6B3; --accent-fg: #0B1513; --accent-soft: #1B2E2A; --brass: #D4B272; --glass: #C9D8D3; --glass-fill: rgba(200, 230, 222, .10);
  --alert: #EA8E70; --alert-soft: #3B241C; --ok: #72CF97; --ok-soft: #173220;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
html.lock, html.lock body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 620px; margin: 0 auto; }
.col.wide { max-width: 1040px; }
.ico { flex: none; display: block; }

/* top bar */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1; margin: 0; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; flex: 1 1 auto; }
.top-actions .pill-btn { flex: none; }
.pill-btn.icon-only { width: 40px; padding: 0; justify-content: center; }
.pill-btn.icon-only[aria-pressed="true"] { background: var(--raised); border-color: var(--line); color: var(--accent); }
.seat { min-width: 0; flex: 0 1 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; max-width: 190px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-weight: 700; font-size: 14px; }
.seat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-weight: 700; font-size: 13px; }
.pill-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 12px; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* main */
#main { padding-block: 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }
#main.staff { padding-bottom: 40px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input[type="search"] { width: 100%; min-height: 48px; padding: 10px 14px 10px 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* quick asks */
.picks { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px 6px; }
.picks::-webkit-scrollbar { display: none; }
.pick { position: relative; flex: 0 0 min(74%, 250px); scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--raised); text-align: left; color: inherit; }
.pick-name { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; padding-right: 34px; }
.pick-desc { font-size: 13px; line-height: 1.38; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pick-go { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px 4px; }
.quick::-webkit-scrollbar { display: none; }
.qtile { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 600; font-size: 15px; white-space: nowrap; color: var(--fg); }
.qtile .ico { color: var(--accent); }
.qtile:active { transform: scale(.98); }
.count { position: static; min-width: 24px; height: 24px; margin-left: 2px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }

/* menu sections */
.section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 124px); display: flex; flex-direction: column; gap: 6px; }
.sec-head { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
.sec-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.sec-head .ico { color: var(--accent); }
.sub-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; min-height: 66px; color: inherit; }
.row-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; text-align: left; color: inherit; }
button.add-dot { border: 0; cursor: pointer; }
button.add-dot:active { transform: scale(.92); }
.ctiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ctile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 116px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: left; color: var(--fg); }
.ctile .ico { color: var(--accent); }
.ctile-name { margin-top: auto; font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.12; overflow-wrap: anywhere; text-wrap: balance; }
.ctile-n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctile.feature { grid-column: 1 / -1; min-height: 120px; border-color: var(--brass); background: linear-gradient(135deg, var(--surface) 30%, var(--accent-soft)); }
.ctile.feature .ico { color: var(--brass); }
.ctile.feature .ctile-name { font-size: 24px; }
.ctile:active, .qtile:active, .choice-btn:active, .tile:active { transform: scale(.98); }
.skel-tile { background: var(--raised); }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 16px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--fg); }
.cat-next { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; padding: 10px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: left; color: var(--fg); }
.cat-next > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cat-next-name { font-family: var(--display); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.cat-next .ico { color: var(--accent); }
.again-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.again-card > .ico { color: var(--accent); }
.again-card > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.again-card .line-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.again-card .btn { flex: none; }
.row:first-child { border-top: 0; }
.row:active, .row-open:active { background: var(--raised); }
.row .ico.lead { color: var(--accent); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-name { font-weight: 600; overflow-wrap: anywhere; }
.row-desc { font-size: 13px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.sheet-desc { margin-top: 8px !important; color: var(--fg) !important; font-size: 15px !important; }
.desc-field { grid-column: 1 / -1; }
.row-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.flag { margin-right: 6px; font-size: 1.05em; }
.row-info { display: block; margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--fg); font-weight: 400; }
.add-dot { flex: none; width: 40px; height: 40px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.add-dot.has { background: var(--accent); color: var(--accent-fg); }

/* cards, fields, buttons */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h3 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.15; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.req-tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
input[type="text"], input[type="number"], input[type="search"], select, textarea { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); }
textarea { min-height: 80px; resize: vertical; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 15px; }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt.sm { min-height: 40px; padding: 0 13px; font-size: 14px; }
.opt.alg[aria-pressed="true"] { background: var(--alert); border-color: var(--alert); color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 16px; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--raised); color: var(--fg); border: 1px solid var(--line); }
.btn.small { min-height: 42px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.stepper { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); display: inline-flex; align-items: center; justify-content: center; }
.stepper output { min-width: 30px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 128px), 1fr)); gap: 10px; }
.tile { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; text-align: left; }
.tile .ico { color: var(--accent); }
.tile[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tile[aria-pressed="true"] .ico { color: var(--accent-fg); }

/* order lines and tracker */
.line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; padding-top: 0; }
.line-main { flex: 1; min-width: 0; }
.line-name { font-weight: 600; overflow-wrap: anywhere; }
.line-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.status.new { background: var(--accent-soft); color: var(--accent); }
.status.done { background: var(--ok-soft); color: var(--ok); }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.track { display: flex; flex-direction: column; gap: 10px; }
.tcard { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--raised); display: flex; flex-direction: column; gap: 8px; }
.thead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ttitle { font-weight: 700; }
.ttime { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tbody { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--accent-soft); color: var(--fg); }
.banner .ico { color: var(--accent); margin-top: 2px; }
.banner.warn { background: var(--alert-soft); }
.banner.warn .ico { color: var(--alert); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ico { color: var(--accent); }
.skel { height: 66px; border-top: 1px solid var(--line); background: linear-gradient(90deg, transparent, var(--raised), transparent); }
.skel:first-child { border-top: 0; }

/* dock: order bar + bottom nav */
#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: none; }
#dock > * { pointer-events: auto; }
.cartbar-wrap { padding-bottom: 10px; }
.cartbar { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 16px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 16px; box-shadow: var(--shadow); }
.cartbar .n { min-width: 30px; height: 30px; border-radius: 999px; background: var(--accent-fg); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.cartbar .grow { flex: 1; text-align: left; }
nav.bottom { background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.bottom .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--nav-h); }
.navbtn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
.navbtn[aria-current="page"] { color: var(--accent); }
.navbtn .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--alert); color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }

/* bottom sheet */
.scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 620px; margin-inline: auto; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding-top: 18px; padding-bottom: 6px; }
.sheet-head .ico { color: var(--accent); margin-top: 4px; }
.sheet-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; overflow-wrap: anywhere; text-wrap: balance; }
.sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.x { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); display: inline-flex; align-items: center; justify-content: center; }
.sheet-body { overflow-y: auto; padding-block: 12px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sheet-foot { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1; }
.done-mark { width: 72px; height: 72px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: flex; align-items: center; justify-content: center; margin: 8px auto 0; }

/* welcome */
.welcome { min-height: calc(100vh - 120px); display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 24px; }
.welcome h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(38px, 10vw, 56px); line-height: 1.02; text-wrap: balance; }
.welcome .lede { margin: 0; color: var(--muted); font-size: 17px; max-width: 34ch; }
.seatgrid { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
.bigin { font-size: 22px !important; font-weight: 700; text-align: center; }

/* toast */
#toast { position: fixed; left: 0; right: 0; z-index: 30; bottom: calc(var(--nav-h) + 84px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
.toast { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); }
.toast.err { background: var(--alert); color: #fff; }

/* removing and cancelling */
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.link-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 2px; border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; }

@keyframes posflash { 0% { background: var(--gc); color: var(--gc-fg); } 100% { background: var(--raised); } }
@media (prefers-reduced-motion: reduce) { .pos-drop, .pos-it.flash-add { animation: none; } }
.pos-dock { background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0, 0, 0, .10); padding: 10px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }

/* ===== Crew: the separate staff app (open the site with #crew) =====

html[data-app="crew"] {

  --glass: #C9D8D3; --glass-fill: rgba(200, 230, 222, .10); --scrim: rgba(0, 0, 0, .66); --shadow: 0 10px 30px rgba(0, 0, 0, .5);

.crew-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 0 12px; }
.crew-tab { min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 16px; font-weight: 800; letter-spacing: .02em; }

.notice-card { display: flex; gap: 14px; align-items: flex-start; padding: 18px 18px; border-radius: 18px; border: 0; background: var(--brass); color: var(--surface); box-shadow: var(--shadow); }

/* staff POS */

.choice-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--raised); text-align: left; font-weight: 600; font-size: 16px; line-height: 1.25; }

.ai-story { margin: 0; font-style: italic; color: var(--muted); }

.req { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.req.open { border-color: var(--accent); }

.kind.check { background: var(--alert-soft); color: var(--alert); }

.req ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.req li { overflow-wrap: anywhere; }
.mod { display: block; font-size: 13px; color: var(--muted); }

.age { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  function cancelBtn(r) { return '<button type="button" class="link-btn danger" style="margin-top:6px" data-act="cancelReq" data-id="' + esc(r.id) + '">' + icon('close', 15) + (S.confirm === 'cx-' + r.id ? T('cancelConfirm') : T('cancelReq')) + '</button>'; }
  async function cancelReq(id) {
    if (!S.db || !S.uid || S.busy) return;
    S.busy = true; render();
    var ok = false;
    for (var attempt = 0; attempt < 2 && !ok; attempt++) {
      try {
        var ref = S.db.doc('requests/' + S.uid);
        await lockMine(ref);
        var snap = await ref.get();
        var list = (snap.exists && snap.data() && Array.isArray(snap.data().reqs)) ? snap.data().reqs.slice() : [];
        var found = false;
        list = list.map(function (r) { if (r.id === id) { found = true; return Object.assign({}, r, { cancelled: true, cancelledAt: Date.now() }); } return r; });
        if (!found) break;
        await ref.set({ reqs: list, updatedAt: Date.now() });
        ok = true;
      } catch (e) { if (!(e && e.code === 'unavailable')) break; await sleep(500 + Math.random() * 600); }
    }
    S.busy = false;
    if (ok) { S.mine = S.mine.map(function (r) { return r.id === id ? Object.assign({}, r, { cancelled: true }) : r; }); SFX.play('click'); toast(T('cancelledToast')); }
    else toast(T('failed'), true);
    render();
  }

    herbal: ['herb', 'herbal', 'basil', 'rosemary', 'mint', 'elderflower', 'botanical', 'juniper', 'thyme', 'tea', 'floral'],

  var BASE_WORD = { gin: /\bgin\b/, vodka: /vodka/, rum: /\brum\b|cacha/, agave: /tequila|mezcal/, whisky: /whisk|bourbon|scotch/, brandy: /cognac|brandy|calvados|armagnac|p[aá]linka/ };
  var ALG_WORDS = { dairy: ['milk', 'cream', 'baileys', 'butter'], eggs: ['egg'], nuts: ['nut', 'almond', 'hazelnut', 'amaretto', 'disaronno', 'frangelico', 'orgeat'], peanuts: ['peanut'], soy: ['soy'], gluten: ['beer', 'wheat', 'barley', 'lager', 'weissbier'], sulphites: ['wine', 'prosecco', 'champagne', 'vermouth', 'sherry'] };
  var NEAT_CATS = { scotch: 1, whiskey: 1, bourbon: 1, rye: 1, japanese: 1, rum: 1, tequila: 1, mezcal: 1, cognac: 1, palinka: 1 };
  function isAlcoholFree(m, t) { return m.cat === 'mocktail' || m.cat === 'soft' || /alcohol-free|alkoholmentes|\b0%|not (rum|gin)|this is not/.test(t); }
  function localPicks() {
    var a = S.quiz.a, L = S.lang === 'hu' ? 1 : 0, words = (S.aiText || '').toLowerCase().split(/[^a-zà-ſ]+/).filter(function (w) { return w.length >= 4; });
    var flav = Array.isArray(a.flavour) ? a.flavour : [];
    var avoid = [];
    S.allergies.forEach(function (k) { (ALG_WORDS[k] || []).forEach(function (w) { avoid.push(w); }); });
    var optLbl = function (k, v) { var st = QUIZ.filter(function (x) { return x.k === k; })[0], o = st && (st.o || []).filter(function (y) { return y[0] === v; })[0]; return o ? o[1 + L].toLowerCase() : v; };

    var scored = S.menu.filter(function (m) { return !m.off && m.cat !== 'food' && m.cat !== 'coffee' && !seen[m.id]; }).map(function (m) {
      var t = (m.name + ' ' + (m.desc || '') + ' ' + m.cat).toLowerCase(), sc = 0, why = [];

      if (a.alc === 'no' && !af) return null;
      if (a.alc === 'yes' && (af || m.cat === 'soft')) return null;
      if (a.alc === 'no' && m.cat === 'mocktail') sc += 3;

      if (a.style === 'neat' && (NEAT_CATS[m.cat] || m.mods === 'rocks')) { sc += 3; why.push(optLbl('style', 'neat')); }

      flav.forEach(function (f) { if ((FLAV[f] || []).some(function (w) { return t.indexOf(w) > -1; })) { sc += 2; why.push(optLbl('flavour', f)); } });

  function tabLines(orders) {

  function tableGroups() {

      Object.keys(soundAt).forEach(function (n) { if (!have[n]) { delete soundAt[n]; SFX.removeSample(n); } });
      S.soundDocs = have;
      if (S.mode === 'staff' && S.staffTab === 'sounds') renderMain();
    }, function () {});
    db.collection('status').limit(1000).onSnapshot(function (snap) {
      var st = {};
      snap.docs.forEach(function (d) { st[d.id] = d.data(); });
      S.statuses = st;
      if (S.staff) rebuildStaff(guestDocs);
      notifyGuest();
      softRender();
    }, function () {});
    if (S.uid) {
      db.doc('requests/' + S.uid).onSnapshot(function (snap) {
        var d = snap.exists && snap.data();
        S.mine = (d && Array.isArray(d.reqs)) ? d.reqs : S.mine;
        notifyGuest();
        if (S.mode !== 'staff') render();
      }, function () {});
    }
    if (S.staff) {
      db.collection('requests').limit(500).onSnapshot(function (snap) {
        guestDocs = rows(snap);
        rebuildStaff(guestDocs);
        firstStaffSnap = false;
        softRender();
      }, function () {});
    }
    setTimeout(function () { if (S.dbState === 'loading') { S.dbState = 'ok'; render(); } }, 8000);
  }
  setInterval(function () { if (S.mode === 'staff' && !document.hidden && !S.sheet && !padBusy() && !(document.activeElement && /^f-m|^mods-|^f-staffq|^f-ed|^f-pad|^pl-/.test(document.activeElement.id))) withFocus(renderMain); }, 30000);
  window.addEventListener('hashchange', function () {
    if (ROLE !== 'both') { if (ROLE === 'guest') { var mg = /^#t([A-Za-z0-9]{1,6})$/.exec(location.hash || ''); if (mg) { if (mg[1] !== S.table) newVisit(true); S.table = mg[1]; S.started = true; lsSet('lounge.table', S.table); render(); } } return; }
    if (location.hash === '#demo') { showHome(); return; }
    if (location.hash === '#pad') { S.padOnly = true; S.mode = 'staff'; S.staffTab = 'pad'; render(); return; }
    if (location.hash === '#crew') { S.crew = true; S.mode = 'staff'; if (S.staffTab !== 'pad') S.staffTab = 'req'; render(); return; }
    var m = /^#t([A-Za-z0-9]{1,6})$/.exec(location.hash || '');
    if (m && ROLE !== 'crew') { if (m[1] !== S.table) newVisit(true); S.table = m[1]; S.started = true; lsSet('lounge.table', S.table); render(); }
  });
  boot();
})();
</script>
